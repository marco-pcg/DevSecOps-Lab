name: local-ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          test -f README.md
          test -f Dockerfile
          test -f app/app.py
          test -f compose/docker-compose.dev.yml
          test -f compose/docker-compose.staging.yml
          test -f security/semgrep.yml
          test -f security/trivy.yaml
